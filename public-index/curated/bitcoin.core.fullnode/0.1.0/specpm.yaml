apiVersion: specpm.dev/v0.1
kind: SpecPackage
metadata:
  id: bitcoin.core.fullnode
  name: Bitcoin Core Full Node
  version: 0.1.0
  summary: Run a Bitcoin Core node that downloads and fully validates the Bitcoin blockchain, with optional
    wallet, RPC, and graphical interfaces.
  license: MIT
  authors:
  - name: SpecPM Maintainers (AI-assisted curation)
specs:
- path: specs/main.spec.yaml
